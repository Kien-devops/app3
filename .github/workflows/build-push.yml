name: Build, Scan, and Push ECR Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: app3-ecr-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::620306387033:role/github-actions-sre-platform-deployer' }}
  PLATFORM_REPOSITORY: Kien-devops/aws-cloud-native-sre-platform

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  security:
    uses: ./.github/workflows/security-scan.yml

  build-scan-push:
    if: github.ref == 'refs/heads/main'
    needs: [test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth-service
            dockerfile: docker/Dockerfile.auth
            repository: reliabilityshop/auth-service
          - name: order-service
            dockerfile: docker/Dockerfile.order
            repository: reliabilityshop/order-service
          - name: inventory-service
            dockerfile: docker/Dockerfile.inventory
            repository: reliabilityshop/inventory-service
          - name: payment-worker
            dockerfile: docker/Dockerfile.payment
            repository: reliabilityshop/payment-worker
          - name: frontend
            dockerfile: docker/Dockerfile.frontend
            repository: reliabilityshop/frontend

    steps:
      - name: Require deployment role
        shell: bash
        run: test -n "$AWS_ROLE_ARN" || { echo 'Repository variable AWS_ROLE_ARN is required'; exit 1; }

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af6772620 # v4

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Prepare immutable image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ matrix.service.repository }}
        shell: bash
        run: |
          IMAGE="$REGISTRY/$REPOSITORY:git-$GITHUB_SHA"
          DIGEST=$(aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=git-$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "ref=$IMAGE" >> "$GITHUB_OUTPUT"
          if [[ "$DIGEST" == sha256:* ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            docker pull "$IMAGE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build immutable image
        if: steps.image.outputs.exists == 'false'
        shell: bash
        run: |
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE" \
            --file "${{ matrix.service.dockerfile }}" .

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push immutable image
        if: steps.image.outputs.exists == 'false'
        shell: bash
        run: docker push "$IMAGE"

      - name: Record ECR digest
        env:
          REPOSITORY: ${{ matrix.service.repository }}
        shell: bash
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=git-$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          test "$DIGEST" != "None"
          echo "- $REPOSITORY@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  promote-gitops:
    if: github.ref == 'refs/heads/main'
    needs: [test, security, build-scan-push]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require deployment role
        shell: bash
        run: test -n "$AWS_ROLE_ARN" || { echo 'Repository variable AWS_ROLE_ARN is required'; exit 1; }

      - name: Check GitOps token
        shell: bash
        run: |
          if [ -z "${{ secrets.GITOPS_REPO_TOKEN }}" ]; then
            echo "::error::Secret GITOPS_REPO_TOKEN is missing in app3 repository secrets."
            exit 1
          fi

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Checkout platform repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af6772620 # v4
        with:
          repository: ${{ env.PLATFORM_REPOSITORY }}
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: platform

      - name: Resolve ECR digests and update GitOps overlay
        id: update
        env:
          APP_COMMIT: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          commit = os.environ['APP_COMMIT']
          branch = os.environ.get('BRANCH_NAME', 'dev')

          services = {
              'frontend': 'reliabilityshop/frontend',
              'order-service': 'reliabilityshop/order-service',
              'inventory-service': 'reliabilityshop/inventory-service',
              'auth-service': 'reliabilityshop/auth-service',
              'payment-worker': 'reliabilityshop/payment-worker',
          }
          digests = {}
          for name, repository in services.items():
              digest = subprocess.check_output([
                  'aws', 'ecr', 'describe-images',
                  '--repository-name', repository,
                  '--image-ids', f'imageTag=git-{commit}',
                  '--query', 'imageDetails[0].imageDigest',
                  '--output', 'text',
              ], text=True).strip()
              if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
                  raise SystemExit(f'No valid digest found for {repository}:git-{commit}')
              digests[name] = (repository, digest)

          targets = [
              pathlib.Path(f'platform/gitops/applications/reliability-shop/envs/{branch}/kustomization.yaml'),
              pathlib.Path('platform/gitops/applications/reliability-shop/base/kustomization.yaml'),
          ]
          for path in targets:
              if path.exists():
                  source = path.read_text(encoding='utf-8')
                  for name, (repository, digest) in digests.items():
                      pattern = rf'(  - name: {re.escape(repository)}\n    newName: [^\n]+\n    digest: )sha256:[0-9a-f]{{64}}'
                      source, count = re.subn(pattern, rf'\g<1>{digest}', source)
                  path.write_text(source, encoding='utf-8', newline='\n')

          rows = [
              "| Dịch vụ (Service) | Tag Image | ECR Immutable Digest |",
              "| :--- | :--- | :--- |"
          ]
          for name, (repo, dig) in digests.items():
              rows.append(f"| `{name}` | `git-{commit[:7]}` | `{dig}` |")
          with open('digests_table.md', 'w', encoding='utf-8') as f:
              f.write("\n".join(rows))
          PY

      - name: Open Pull Request to GitOps repository
        env:
          APP_COMMIT: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        working-directory: platform
        shell: bash
        run: |
          if git diff --quiet; then
            echo "GitOps $TARGET_BRANCH already references these image digests. No changes needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          SHORT_SHA=${APP_COMMIT:0:7}
          PROMOTION_BRANCH="gitops/promote-${TARGET_BRANCH}-${SHORT_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$PROMOTION_BRANCH"
          git add gitops/applications/reliability-shop/
          git commit -m "deploy(app3): promote $SHORT_SHA image digests to $TARGET_BRANCH"
          git push origin "$PROMOTION_BRANCH" --force

          DIGEST_TABLE=$(cat ../digests_table.md)

          PR_BODY=$(cat <<EOF
          ## 🚀 SRE GitOps Promotion: App3 Commit \`$SHORT_SHA\` ➔ \`$TARGET_BRANCH\`

          ### 🛡️ 1. Đánh giá Quá trình CI & Quality Gates
          | Hạng mục kiểm tra | Công cụ thực hiện | Trạng thái | Đánh giá SRE |
          | :--- | :--- | :---: | :--- |
          | **Môi trường đích** | GitOps Branch | 🎯 **\`$TARGET_BRANCH\`** | Đồng bộ cho môi trường \`$TARGET_BRANCH\` |
          | **Unit & Integration Tests** | Node.js Test Runner | ✅ **PASSED** | 100% tests đạt |
          | **Secret Leak Scanning** | Gitleaks | ✅ **PASSED** | 0 secrets rò rỉ |
          | **Container Vulnerability** | Aqua Trivy Scanner | ✅ **PASSED** | 0 CRITICAL / 0 HIGH CVEs |
          | **Immutable Artifacts** | Amazon ECR | ✅ **STORED** | Đã đẩy 5 image bất biến lên ECR |

          ---

          ### 📦 2. Danh sách Image Digests Đề xuất Cập nhật (\`$TARGET_BRANCH\`)
          $DIGEST_TABLE

          ---

          ### 🔍 3. Thông tin Truy vết Nguồn gốc (Traceability)
          * **Source Repository:** \`Kien-devops/app3\`
          * **Source Branch:** \`$TARGET_BRANCH\`
          * **Commit SHA:** [\`$APP_COMMIT\`](https://github.com/Kien-devops/app3/commit/$APP_COMMIT)
          * **Commit Message:** \`$COMMIT_MSG\`
          * **Triggered By:** @$ACTOR
          * **CI Pipeline Run:** [View Workflow Run]($RUN_URL)

          ---
          > 💡 **Hướng dẫn duyệt (Merge Gate):**
          > Sau khi kiểm tra diff và bảng đánh giá chất lượng bên trên, bạn chỉ cần bấm **"Merge pull request"**.
          > Argo CD sẽ tự động phát hiện nhánh **\`$TARGET_BRANCH\`** thay đổi và đồng bộ phiên bản mới lên cụm EKS!
          EOF
          )

          EXISTING_PR=$(gh pr list --repo "$PLATFORM_REPOSITORY" --head "$PROMOTION_BRANCH" --base "$TARGET_BRANCH" --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #$EXISTING_PR"
            gh pr edit "$EXISTING_PR" --repo "$PLATFORM_REPOSITORY" --title "deploy(app3): promote $SHORT_SHA image digests to $TARGET_BRANCH" --body "$PR_BODY"
          else
            echo "Creating new PR"
            gh pr create \
              --repo "$PLATFORM_REPOSITORY" \
              --base "$TARGET_BRANCH" \
              --head "$PROMOTION_BRANCH" \
              --title "deploy(app3): promote $SHORT_SHA image digests to $TARGET_BRANCH" \
              --body "$PR_BODY"
          fi
